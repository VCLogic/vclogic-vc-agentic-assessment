[project]
name = "vclogic-vc-agentic-assessment"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "numpy>=2.0,<3",
  "openai>=1.100,<3",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "rank-bm25>=0.2.2,<1",
  "scipy>=1.14,<2",
  "scikit-learn>=1.7,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
embeddings = ["sentence-transformers>=5.3,<6"]
tabular = ["tabpfn>=2,<7"]
setfit = ["setfit>=1,<2", "torch>=2.6,<3"]
graph = ["torch-geometric>=2.6,<3", "torch>=2.6,<3"]
personalized = [
  "sentence-transformers>=5.3,<6",
  "tabpfn>=2,<7",
  "setfit>=1,<2",
  "torch>=2.6,<3",
  "torch-geometric>=2.6,<3",
]

[project.scripts]
vc-clone-graph = "vc_clone_graph.cli:main"
vc-clone-rehearsal = "vc_clone_graph.rehearsal_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vc_clone_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
