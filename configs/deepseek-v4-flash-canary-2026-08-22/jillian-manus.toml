[run]
vc_slug = "jillian-manus-structure-capital"
episode_slug = "12-i-dont-need-your-money-teamable"
input_root = "inputs"
output_root = "outputs/deepseek-v4-flash-low-canary-2026-08-22/investors/jillian-manus"
checkpoint_path = "outputs/deepseek-v4-flash-low-canary-2026-08-22/investors/jillian-manus/checkpoints/12-i-dont-need-your-money-teamable.sqlite"
contract_version = "v4"

[provider]
kind = "openrouter"
model = "deepseek/deepseek-v4-flash"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
require_parameters = true
data_collection = "deny"
max_output_tokens = 16384

[embedding]
kind = "sentence_transformers"
model = "nomic-ai/nomic-embed-text-v1.5"
revision = "e9b6763023c676ca8431644204f50c2b100d9aab"
device = "auto"
batch_size = 16
normalize = true
document_prefix = "search_document: "
query_prefix = "search_query: "
require_complete_index = true

[phase1]
model = "deepseek/deepseek-v4-flash"
reasoning_effort = "low"
min_iterations = 1
max_iterations = 4
max_output_tokens = 16384
planning_max_output_tokens = 8192
planning_reasoning_effort = "low"
max_precedent_searches = 4
max_precedent_reads = 8

[phase2]
model = "deepseek/deepseek-v4-flash"
reasoning_effort = "low"
min_iterations = 1
max_iterations = 4
max_output_tokens = 16384
planning_max_output_tokens = 8192
planning_reasoning_effort = "low"
max_precedent_searches = 4
max_precedent_reads = 8

[retrieval]
top_k = 6
max_exact_reads = 12

[precedents]
enabled = true
corpus_path = "data/investors/jillian-manus-structure-capital/precedents"
allow_full_transcript = true
selection_policy = "contrastive"
candidate_pool_k = 30
in_slots = 2
out_slots = 2
