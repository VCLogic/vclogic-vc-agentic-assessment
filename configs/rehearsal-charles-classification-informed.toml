[rehearsal]
input_root = "inputs"
output_root = "outputs/rehearsals"
checkpoint_path = "outputs/rehearsals/checkpoints.sqlite"
taxonomy_path = "taxonomy/codebook_v_final.json"
max_questions = 4
max_output_tokens = 8192
reasoning_effort = "high"
repair_attempts = 1

[provider]
kind = "openrouter"
model = "openai/gpt-5.6-luna"
api_key_env = "OPENROUTER_API_KEY"
max_output_tokens = 8192
require_parameters = true
data_collection = "deny"
request_timeout_seconds = 300

[embedding]
kind = "sentence_transformers"
model = "nomic-ai/nomic-embed-text-v1.5"
revision = "e9b6763023c676ca8431644204f50c2b100d9aab"
device = "auto"
batch_size = 16
normalize = true
document_prefix = "search_document: "
query_prefix = "search_query: "
require_complete_index = true

[retrieval]
top_k = 5
max_exact_reads = 12

[precedents]
enabled = true
corpus_path = "data/investors/<vc_slug>/precedents"
selection_policy = "semantic"
candidate_pool_k = 30
in_slots = 2
out_slots = 3

[portfolio_memory]
enabled = true
corpus_path = "data/investors/<vc_slug>/portfolio-memory"
retrieval_top_k = 5
candidate_pool_k = 15

[question_memory]
enabled = true
top_k = 5
candidate_pool_k = 30
semantic_weight = 0.50
rationale_weight = 0.25
lexical_weight = 0.15
atomicity_bonus = 0.10
long_question_penalty = 0.10
multi_request_penalty = 0.20
duplicate_penalty = 0.40
minimum_hybrid_score = 0.25

[classification]
mode = "classification_informed"
registry_path = "evaluation/rehearsal_classifier_registry/registry.json"
minimum_probability_impact = 0.05
minimum_questions = 1
maximum_questions = 4
fallback_to_rationale_only = false
